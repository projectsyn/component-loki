applications:
  - openshift4-monitoring

parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/appuio/component-openshift4-monitoring/v5.5.1/lib/openshift4-monitoring-alert-patching.libsonnet
        output_path: vendor/lib/alert-patching.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/appuio/component-openshift4-monitoring/v5.5.1/lib/openshift4-monitoring-prom.libsonnet
        output_path: vendor/lib/prom.libsonnet

  facts:
    distribution: openshift4

  loki:
    secrets:
      loki-bucket-secret:
        stringData:
          S3_ACCESS_KEY_ID: ?{vaultkv:${cluster:tenant}/${cluster:name}/vshn-appuio-loki/S3_ACCESS_KEY_ID}
          S3_SECRET_ACCESS_KEY: ?{vaultkv:${cluster:tenant}/${cluster:name}/vshn-appuio-loki/S3_SECRET_ACCESS_KEY}
          S3_ENDPOINT: ?{vaultkv:${cluster:tenant}/${cluster:name}/vshn-appuio-loki/S3_ENDPOINT}
          S3_REGION: ?{vaultkv:${cluster:tenant}/${cluster:name}/vshn-appuio-loki/S3_REGION}
      loki-nginx-htpasswd:
        stringData:
          .htpasswd: "?{vaultkv:${cluster:tenant}/${cluster:name}/vshn-appuio-loki/htpasswd}"

    helm_values:
      loki:
        compactor:
          compaction_interval: 10m
          delete_request_store: s3
          retention_enabled: true
          retention_delete_delay: 2h
          retention_delete_worker_count: 150
          working_directory: /var/loki/compactor/retention
        limits_config:
          ingestion_burst_size_mb: 32
          ingestion_rate_mb: 15
          retention_period: 60d
        podSecurityContext:
          fsGroup: null
          runAsGroup: null
          runAsNonRoot: true
          runAsUser: null
      monitoring:
        serviceMonitor:
          enabled: true
        rules:
          enabled: true
      gateway:
        enabled: true
        podSecurityContext:
          fsGroup: null
          runAsGroup: null
          runAsNonRoot: true
          runAsUser: null
        basicAuth:
          enabled: true
          existingSecret: loki-nginx-htpasswd
        ingress:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: letsencrypt-production
          hosts:
            - host: logs-receive.appuio.net
              paths:
                - path: /loki/api/v1/push
                  pathType: Prefix
                - path: /otlp/v1/logs
                  pathType: Prefix
          tls:
            - secretName: logs-receive-appuio-net-tls
              hosts:
                - logs-receive.appuio.net
        # SG: work around broken gateway /metrics endpoint, cf.
        # https://github.com/grafana/loki/issues/9522
        service:
          labels:
            prometheus.io/service-monitor: "false"
      memcached:
        # SFe/1.10.2025: Remove security context not suitable for OpenShift
        podSecurityContext: null
