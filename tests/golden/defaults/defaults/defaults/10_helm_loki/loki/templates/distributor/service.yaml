apiVersion: v1
kind: Service
metadata:
  annotations: null
  labels:
    app.kubernetes.io/component: distributor
    app.kubernetes.io/instance: defaults
    app.kubernetes.io/name: loki
    app.kubernetes.io/version: 3.7.7
    helm.sh/chart: loki-18.13.0
  name: defaults-loki-distributor
  namespace: defaults
spec:
  ports:
    - name: http-metrics
      port: 3100
      protocol: TCP
      targetPort: http-metrics
    - name: grpc
      port: 9095
      protocol: TCP
      targetPort: grpc
    - name: grpclb
      port: 9096
      protocol: TCP
      targetPort: grpc
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: distributor
    app.kubernetes.io/instance: defaults
    app.kubernetes.io/name: loki
  type: ClusterIP
