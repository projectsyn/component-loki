apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
  labels:
    app.kubernetes.io/component: gateway
    app.kubernetes.io/instance: openshift
    app.kubernetes.io/name: loki
    app.kubernetes.io/version: 3.7.7
    helm.sh/chart: loki-18.13.0
  name: openshift-loki-gateway
  namespace: openshift
spec:
  rules:
    - host: logs-receive.appuio.net
      http:
        paths:
          - backend:
              service:
                name: openshift-loki-gateway
                port:
                  number: 80
            path: /
            pathType: Prefix
  tls:
    - hosts:
        - logs-receive.appuio.net
      secretName: logs-receive-appuio-net-tls
