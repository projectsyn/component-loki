apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  labels:
    app.kubernetes.io/component: ingester
    app.kubernetes.io/instance: openshift
    app.kubernetes.io/name: loki
    app.kubernetes.io/version: 3.7.9
    helm.sh/chart: loki-19.1.1
  name: openshift-loki-ingester
  namespace: openshift
spec:
  maxUnavailable: 1
  selector:
    matchExpressions:
      - key: rollout-group
        operator: NotIn
        values:
          - ingester
    matchLabels:
      app.kubernetes.io/component: ingester
      app.kubernetes.io/instance: openshift
      app.kubernetes.io/name: loki
