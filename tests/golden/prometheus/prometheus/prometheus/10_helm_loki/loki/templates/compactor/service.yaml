apiVersion: v1
kind: Service
metadata:
  annotations: null
  labels:
    app.kubernetes.io/component: compactor
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: loki
    app.kubernetes.io/version: 3.7.3
    helm.sh/chart: loki-18.5.1
  name: prometheus-loki-compactor
  namespace: prometheus
spec:
  ports:
    - name: http-metrics
      port: 3100
      protocol: TCP
      targetPort: http-metrics
    - name: grpc
      port: 9095
      protocol: TCP
      targetPort: grpc
    - name: grpclb
      port: 9096
      protocol: TCP
      targetPort: grpc
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/component: compactor
    app.kubernetes.io/instance: prometheus
    app.kubernetes.io/name: loki
  type: ClusterIP
