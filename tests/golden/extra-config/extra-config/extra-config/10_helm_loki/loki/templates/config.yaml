apiVersion: v1
data:
  config.yaml: |2

    auth_enabled: true
    bloom_build:
      builder:
        planner_address: extra-config-loki-bloom-planner-headless.extra-config.svc.cluster.local:9095
      enabled: false
    bloom_gateway:
      client:
        addresses: dnssrvnoa+_grpc._tcp.extra-config-loki-bloom-gateway-headless.extra-config.svc.cluster.local
      enabled: false
    chunk_store_config:
      chunk_cache_config:
        background:
          writeback_buffer: 500000
          writeback_goroutines: 1
          writeback_size_limit: 500MB
        default_validity: 0s
        memcached:
          batch_size: 4
          parallelism: 5
        memcached_client:
          addresses: dnssrvnoa+_memcached-client._tcp.extra-config-loki-chunks-cache.extra-config.svc.cluster.local
          consistent_hash: true
          max_idle_conns: 72
          timeout: 2000ms
    common:
      compactor_grpc_address: 'extra-config-loki-compactor.extra-config.svc.cluster.local:9095'
      path_prefix: /var/loki
      replication_factor: 3
      storage:
        s3:
          access_key_id: ${S3_ACCESS_KEY_ID}
          bucketnames: extra-config-chunks
          endpoint: s3.example.com
          insecure: false
          region: us-east-1
          s3forcepathstyle: true
          secret_access_key: ${S3_SECRET_ACCESS_KEY}
    frontend:
      scheduler_address: extra-config-loki-query-scheduler-headless.extra-config.svc.cluster.local:9095
      tail_proxy_url: http://extra-config-loki-querier.extra-config.svc.cluster.local:3100
    frontend_worker:
      scheduler_address: extra-config-loki-query-scheduler-headless.extra-config.svc.cluster.local:9095
    index_gateway:
      mode: simple
    ingester:
      chunk_encoding: snappy
      wal:
        flush_on_shutdown: true
    limits_config:
      max_cache_freshness_per_query: 10m
      query_timeout: 300s
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      retention_period: 30d
      split_queries_by_interval: 15m
      volume_enabled: true
    memberlist:
      abort_if_cluster_join_fails: true
      advertise_port: 7946
      bind_port: 7946
      join_members:
      - extra-config-loki-memberlist.extra-config.svc.cluster.local
      max_join_backoff: 1m
      max_join_retries: 10
      min_join_backoff: 1s
      rejoin_interval: 90s
    pattern_ingester:
      enabled: false
    querier:
      max_concurrent: 4
    query_range:
      align_queries_with_step: true
      cache_results: true
      results_cache:
        cache:
          background:
            writeback_buffer: 500000
            writeback_goroutines: 1
            writeback_size_limit: 500MB
          default_validity: 12h
          memcached_client:
            addresses: dnssrvnoa+_memcached-client._tcp.extra-config-loki-results-cache.extra-config.svc.cluster.local
            consistent_hash: true
            timeout: 500ms
            update_interval: 1m
    ruler:
      storage:
        s3:
          access_key_id: ${S3_ACCESS_KEY_ID}
          bucketnames: extra-config-ruler
          endpoint: s3.example.com
          insecure: false
          region: us-east-1
          s3forcepathstyle: true
          secret_access_key: ${S3_SECRET_ACCESS_KEY}
        type: s3
      wal:
        dir: /var/loki/ruler-wal
    runtime_config:
      file: /etc/loki/runtime-config/runtime-config.yaml
    schema_config:
      configs:
      - from: "2024-04-01"
        index:
          period: 24h
          prefix: loki_index_
        object_store: s3
        schema: v13
        store: tsdb
    server:
      graceful_shutdown_timeout: 5s
      grpc_listen_port: 9095
      grpc_server_max_concurrent_streams: 1000
      grpc_server_max_recv_msg_size: 104857600
      grpc_server_max_send_msg_size: 104857600
      grpc_server_min_time_between_pings: 10s
      grpc_server_ping_without_stream_allowed: true
      http_listen_port: 3100
      http_server_idle_timeout: 30s
      http_server_read_timeout: 10m0s
      http_server_write_timeout: 10m0s
      log_level: info
    storage_config:
      bloom_shipper:
        working_directory: /var/loki/data/bloomshipper
      boltdb_shipper:
        index_gateway_client:
          server_address: dns+extra-config-loki-index-gateway-headless.extra-config.svc.cluster.local:9095
      hedging:
        at: 250ms
        max_per_second: 20
        up_to: 3
      tsdb_shipper:
        index_gateway_client:
          server_address: dns+extra-config-loki-index-gateway-headless.extra-config.svc.cluster.local:9095
      use_thanos_objstore: false
    tracing:
      enabled: true
kind: ConfigMap
metadata:
  labels:
    app.kubernetes.io/instance: extra-config
    app.kubernetes.io/name: loki
    app.kubernetes.io/version: 3.7.4
    helm.sh/chart: loki-18.5.2
  name: loki
  namespace: extra-config
