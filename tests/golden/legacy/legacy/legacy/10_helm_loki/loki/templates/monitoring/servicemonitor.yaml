apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/instance: legacy
    app.kubernetes.io/name: loki
    app.kubernetes.io/version: 3.7.4
    helm.sh/chart: loki-18.5.2
  name: legacy-loki
  namespace: legacy
spec:
  endpoints:
    - interval: 15s
      path: /metrics
      port: http-metrics
      relabelings:
        - action: replace
          replacement: legacy/$1
          sourceLabels:
            - job
          targetLabel: job
        - action: replace
          replacement: legacy-loki
          targetLabel: app_instance
      scheme: http
  selector:
    matchExpressions:
      - key: prometheus.io/service-monitor
        operator: NotIn
        values:
          - 'false'
    matchLabels:
      app.kubernetes.io/instance: legacy
      app.kubernetes.io/name: loki
