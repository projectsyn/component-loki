applications:
  - openshift4-monitoring

parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/appuio/component-openshift4-monitoring/v5.5.1/lib/openshift4-monitoring-alert-patching.libsonnet
        output_path: vendor/lib/alert-patching.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/appuio/component-openshift4-monitoring/v5.5.1/lib/openshift4-monitoring-prom.libsonnet
        output_path: vendor/lib/prom.libsonnet

  facts:
    cloud: exoscale
    region: ch-dk-2

  loki:
    images:
      loki:
        registry: dockerhub.vshn.net
      memcached:
        registry: dockerhub.vshn.net
      memcachedExporter:
        registry: dockerhub.vshn.net
      nginx:
        registry: dockerhub.vshn.net
      accessLogExporter:
        tag: latest

    components:
      ruler:
        enabled: true

    s3:
      endpoint: 's3.example.com'
      region: 'us-east-1'

    ingress:
      enabled: true
      tls:
        clusterIssuer: null
        key: |
          -----BEGIN PRIVATE KEY-----
          ...
          -----END PRIVATE KEY-----
        cert: |
          -----BEGIN CERTIFICATE-----
          ...
          -----END CERTIFICATE-----
      url: metrics-receive.example.com
      labels:
        custom-label: my-label

    basicAuth:
      enabled: true

    monitoring: false
