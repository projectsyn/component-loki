applications:
  - prometheus

parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-prometheus/v2.15.0/lib/prometheus.libsonnet
        output_path: vendor/lib/prometheus.libsonnet

  loki:
    alerts:
      additionalRules:
        'alert:LokiTestAlert':
          expr: vector(1) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Test alert
    helm_values:
      monitoring:
        rules:
          enabled: true
