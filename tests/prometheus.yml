applications:
  - prometheus

parameters:
  kapitan:
    dependencies:
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-prometheus/master/lib/prometheus.libsonnet
        output_path: vendor/lib/prometheus.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-prometheus/master/lib/prometheus-prom.libsonnet
        output_path: vendor/lib/prom.libsonnet
      - type: https
        source: https://raw.githubusercontent.com/projectsyn/component-prometheus/master/lib/prometheus-alert-patching.libsonnet
        output_path: vendor/lib/alert-patching.libsonnet

  prometheus:
    alerts:
      ignoreNames: []

  loki:
    alerts:
      additionalRules:
        'alert:LokiTestAlert':
          expr: vector(1) == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Test alert
