parameters:
  kapitan:
    dependencies:
      - type: helm
        source: ${loki:charts:loki:source}
        chart_name: loki
        version: ${loki:charts:loki:version}
        output_path: ${_base_directory}/helmcharts/loki/${loki:charts:loki:version}

    compile:
      - input_paths:
          - ${_base_directory}/component/app.jsonnet
        input_type: jsonnet
        output_path: .
      - input_paths:
          - ${_base_directory}/component/main.jsonnet
        input_type: jsonnet
        output_path: ${_instance}/

      # Helm chart
      - input_type: jsonnet
        input_paths:
          - ${_base_directory}/component/helm_presets.jsonnet
          - ${_base_directory}/component/helm_values.jsonnet
        output_path: ${_base_directory}/helmcharts/loki/${loki:charts:loki:version}/
      - input_type: helm
        output_type: yaml
        input_paths:
          - ${_base_directory}/helmcharts/loki/${loki:charts:loki:version}
        output_path: ${_instance}/10_helm_loki
        helm_values_files:
          - ${_base_directory}/helmcharts/loki/${loki:charts:loki:version}/${loki:preset}.yaml
          - ${_base_directory}/helmcharts/loki/${loki:charts:loki:version}/${_instance}-components.yaml
          - ${_base_directory}/helmcharts/loki/${loki:charts:loki:version}/${_instance}-configs.yaml
          - ${_base_directory}/helmcharts/loki/${loki:charts:loki:version}/${_instance}-overrides.yaml
        helm_params:
          name: ${_instance}
          namespace: ${loki:namespace:name}
          api_versions: monitoring.coreos.com/v1/ServiceMonitor,monitoring.coreos.com/v1/PrometheusRule

  commodore:
    postprocess:
      filters:
        - type: jsonnet
          filter: postprocess/remove-null-objs.jsonnet
          path: ${_instance}/10_helm_loki/loki/templates/monitoring
        - type: jsonnet
          filter: postprocess/patch-alerts.jsonnet
          path: ${_instance}/10_helm_loki/loki/templates/monitoring
        - type: jsonnet
          filter: postprocess/patch-crb.jsonnet
          path: ${_instance}/10_helm_loki/loki/templates/backend
