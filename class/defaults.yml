parameters:
  loki:
    =_metadata:
      multi_instance: true
      multi_tenant: true

    name: ${_instance}
    namespace:
      name: syn-loki
      create: true
      metadata: {}

    charts:
      loki:
        source: https://grafana.github.io/helm-charts
        version: 6.55.0

    images:
      loki:
        registry: docker.io
        repository: grafana/loki
      memcached:
        registry: docker.io
        repository: library/memcached
      memcachedExporter:
        registry: docker.io
        repository: prom/memcached-exporter
      nginx:
        registry: docker.io
        repository: nginxinc/nginx-unprivileged

    preset: legacy

    components:
      # Read Path
      querier:
        enabled: true
      queryFrontend:
        enabled: true
      queryScheduler:
        enabled: true
      # Write Path
      distributor:
        enabled: true
      ingester:
        enabled: true
      # Backend
      compactor:
        enabled: true
      indexGateway:
        enabled: true
      # Ingress
      gateway:
        enabled: true
      # Optional
      alertmanager:
        enabled: true
      overridesExporter:
        enabled: true
      ruler:
        enabled: true

    caches:
      chunks:
        enabled: true
      results:
        enabled: true

    experimental:
      # Experimental
      bloomPlanner:
        enabled: false
      bloomBuilder:
        enabled: false
      bloomGateway:
        enabled: false

    global:
      nodeSelector: {}
      retention: 30d
      zoneAwareReplication:
        enabled: false
        topologyKey: 'kubernetes.io/hostname'

    s3:
      bucketPrefix: ${_instance}
      endpoint: ''
      region: null
      forcePathStyle: true
      insecure: false
      auth:
        accessKeyId: '?{vaultkv:${cluster:tenant}/${cluster:name}/${_instance}/s3_access_key}'
        secretAccessKey: '?{vaultkv:${cluster:tenant}/${cluster:name}/${_instance}/s3_secret_key}'
        #increase if auth credentials change
        secretVersion: 0

    secrets: {}

    alerts:
      additionalRules: {}
      patchRules:
        ignoreNames: []
        patches: {}

    helm_values: {}
