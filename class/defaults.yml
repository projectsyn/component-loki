parameters:
  loki:
    =_metadata:
      multi_instance: true
      multi_tenant: true

    namespace:
      name: ${_instance}
      create: true
      metadata: {}

    charts:
      loki:
        source: https://grafana-community.github.io/helm-charts
        version: 18.1.1

    images:
      loki:
        registry: docker.io
        repository: grafana/loki
      memcached:
        registry: docker.io
        repository: library/memcached
      memcachedExporter:
        registry: docker.io
        repository: prom/memcached-exporter
      nginx:
        registry: docker.io
        repository: nginxinc/nginx-unprivileged
      accessLogExporter:
        registry: ghcr.io
        repository: jkroepke/access-log-exporter

    preset: extra-small

    components:
      # Read Path
      querier:
        enabled: true
      queryFrontend:
        enabled: true
      queryScheduler:
        enabled: true
      # Write Path
      distributor:
        enabled: true
      ingester:
        enabled: true
      # Backend
      compactor:
        enabled: true
      indexGateway:
        enabled: true
      # Ingress
      gateway:
        enabled: true
      # Optional
      alertmanager:
        enabled: true
      overridesExporter:
        enabled: true
      ruler:
        enabled: true

    caches:
      chunks:
        enabled: true
      results:
        enabled: true

    experimental:
      # Experimental
      bloomPlanner:
        enabled: false
      bloomBuilder:
        enabled: false
      bloomGateway:
        enabled: false

    global:
      nodeSelector: {}
      retention: 30d
      zoneAwareReplication:
        enabled: false
        topologyKey: 'kubernetes.io/hostname'

    s3:
      bucketPrefix: ${_instance}
      endpoint: ''
      region: null
      forcePathStyle: true
      insecure: false
      auth:
        accessKeyId: '?{vaultkv:${cluster:tenant}/${cluster:name}/${_instance}/s3_access_key}'
        secretAccessKey: '?{vaultkv:${cluster:tenant}/${cluster:name}/${_instance}/s3_secret_key}'
        #increase if auth credentials change
        secretVersion: 0

    networkPolicy:
      enabled: true
      exposedComponents:
        - query-frontend
        - gateway
      allowedNamespaces: []

    ingress:
      enabled: false
      tls:
        enabled: true
        clusterIssuer: 'letsencrypt-production'
        key: null
        cert: null
      url: ''

    basicAuth:
      enabled: false
      htpasswd: '?{vaultkv:${cluster:tenant}/${cluster:name}/${_instance}/htpasswd}'

    monitoring: true
    alerts:
      additionalRules: {}
      patchRules:
        ignoreNames: []
        patches: {}

    secrets: {}

    helm_values: {}
